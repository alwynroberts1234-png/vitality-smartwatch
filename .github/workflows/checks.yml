name: Host checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DVITALITY_HOST_TESTS=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
  assets-and-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: ./tools/Build-Assets.ps1
      - shell: powershell
        run: ./tools/Build-Preview.ps1 -Render

  portable-launchers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_portable.py
      - run: python tests/test_setup.py
      - if: runner.os != 'Windows'
        run: bash -n tools/setup-host.sh tools/run-dev.sh
